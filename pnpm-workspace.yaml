packages:
  - "apps/*"
  - "packages/*"
  - "tests/*"
  - "studio"

allowBuilds:
  '@google/genai': false
  esbuild: true
  onnxruntime-node: false
  protobufjs: false

catalog:
  "@anthropic-ai/claude-agent-sdk": ^0.3.296
  "@biomejs/biome": ^2.5.15
  "@commitlint/config-conventional": ^21.2.3
  "@hono/node-server": ^2.1.4
  "@modelcontextprotocol/sdk": ^1.32.1
  "@node-rs/argon2": ^2.2.2
  "@testing-library/dom": ^10.4.2
  "@testing-library/react": ^16.3.3
  "@types/node": ^26.6.5
  "@types/pg": ^8.23.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@types/ws": ^8.18.2
  "@vitejs/plugin-react": ^6.1.2
  commitlint: ^21.2.3
  drizzle-kit: ^0.31.11
  drizzle-orm: ^0.45.4
  hono: ^4.13.13
  jsdom: ^30.1.2
  lucide-react: ^1.55.0
  pg: ^8.23.1
  pino: ^10.4.0
  react: ^19.3.0
  react-dom: ^19.3.0
  sonner: ^2.0.8
  tailwindcss: ^4.3.3
  tsdown: ^0.23.1
  tsx: ^4.23.15
  typescript: ^7.0.2
  vite: ^8.3.4
  vitest: ^5.0.3
  ws: ^8.22.0
  zod: ^4.6.7

minimumReleaseAgeExclude:
  - zod@4.6.7

# Patched transitive dependencies of @modelcontextprotocol/sdk (through the producer SDK):
# GHSA advisories against body-parser <2.4.0 (denial of service via trailing bytes after a
# compressed body) and fast-uri <3.1.9 (URI parsing). Remove once the SDK depends on fixed releases.
overrides:
  "body-parser@>=2.0.0 <2.4.0": ^2.4.0
  "fast-uri@<3.1.9": ^3.1.9
