name: ci

# Runs once per change, on `main` after the merge, and gates the release (`release.yml` waits for
# it). Pull requests are not built here: `pnpm -r lint && pnpm -r test` runs on the workstation
# before every pull request (AGENTS.md, CONTRIBUTING.md), and `commits.yml` checks the messages.
# Changes to Markdown alone build nothing, except `docs/mcp.md`, which a test checks against the
# tool registry.
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!**/*.md"
      - "docs/mcp.md"
  workflow_dispatch:
  # Weekly, so an advisory published after the last change still fails a run. Only the audit
  # job runs on the schedule.
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

# A newer push to `main` replaces a run still going: its commit carries the older changes, and its
# release ships them.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Fails on a high or critical advisory in a production dependency. A reviewed exception goes in
  # pnpm-workspace.yaml under auditConfig.ignoreGhsas, with a comment naming the advisory, why it
  # does not apply, and an expiry date (docs/security.md, "Dependency advisories").
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  verify:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://loomcast:loomcast@127.0.0.1:55434/loomcast
      TEST_DATABASE_ADMIN_URL: postgres://loomcast:loomcast@127.0.0.1:55434/postgres
      # Object storage for the storage and assets tests; the keys come from s3.json at runtime.
      # TEST_S3=real makes those tests fail instead of falling back to the in-process fake.
      S3_ENDPOINT: http://127.0.0.1:59000
      S3_BUCKET: loomcast-media
      S3_PUBLIC_BUCKET: loomcast-public
      TEST_S3: real
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: loomcast
          POSTGRES_PASSWORD: loomcast
          POSTGRES_DB: loomcast
        ports:
          - 55434:5432
        options: >-
          --health-cmd "pg_isready -U loomcast -d loomcast"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # A step rather than a service container: services cannot override the image command, and
      # SeaweedFS needs one to serve S3. Same image, command and s3.json as docker-compose.yml.
      - name: Start object storage
        run: |
          docker run -d --name seaweedfs -p 127.0.0.1:59000:8333 \
            -v "$PWD/infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:4.48 server -dir=/data -ip.bind=0.0.0.0 -filer \
            -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
          curl -s -o /dev/null --retry 60 --retry-delay 1 --retry-all-errors \
            http://127.0.0.1:59000/
          access_key="$(jq -r '.identities[0].credentials[0].accessKey' infra/seaweedfs/s3.json)"
          secret_key="$(jq -r '.identities[0].credentials[0].secretKey' infra/seaweedfs/s3.json)"
          docker run --rm --network host \
            -v "$PWD/infra/seaweedfs/s3-init.sh:/s3-init.sh:ro" \
            -e AWS_ENDPOINT_URL=http://127.0.0.1:59000 -e AWS_DEFAULT_REGION=us-east-1 \
            -e AWS_ACCESS_KEY_ID="$access_key" -e AWS_SECRET_ACCESS_KEY="$secret_key" \
            -e S3_BUCKET -e S3_PUBLIC_BUCKET \
            --entrypoint /bin/sh amazon/aws-cli:2.31.0 /s3-init.sh
          echo "S3_ACCESS_KEY=$access_key" >> "$GITHUB_ENV"
          echo "S3_SECRET_KEY=$secret_key" >> "$GITHUB_ENV"

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
