name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://loomcast:loomcast@127.0.0.1:55434/loomcast
      TEST_DATABASE_ADMIN_URL: postgres://loomcast:loomcast@127.0.0.1:55434/postgres
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: loomcast
          POSTGRES_PASSWORD: loomcast
          POSTGRES_DB: loomcast
        ports:
          - 55434:5432
        options: >-
          --health-cmd "pg_isready -U loomcast -d loomcast"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
