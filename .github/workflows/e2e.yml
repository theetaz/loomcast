name: e2e

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/e2e.yml"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The smoke creates and drops its own scratch database through this connection.
      TEST_DATABASE_ADMIN_URL: postgres://loomcast:loomcast@127.0.0.1:55434/postgres
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: loomcast
          POSTGRES_PASSWORD: loomcast
          POSTGRES_DB: loomcast
        ports:
          - 55434:5432
        options: >-
          --health-cmd "pg_isready -U loomcast -d loomcast"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @loomcast/e2e exec playwright install --with-deps chromium

      - name: Run the end-to-end smoke
        run: pnpm test:e2e

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore
