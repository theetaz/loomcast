name: e2e

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "tests/**"
      - "infra/seaweedfs/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/e2e.yml"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The smoke creates and drops its own scratch database through this connection.
      TEST_DATABASE_ADMIN_URL: postgres://loomcast:loomcast@127.0.0.1:55434/postgres
      # Object storage for the pipeline spec's uploads; the keys come from s3.json at runtime.
      # LOOMCAST_E2E_S3=required fails the run instead of skipping the spec without a store.
      S3_ENDPOINT: http://127.0.0.1:59000
      S3_BUCKET: loomcast-media
      S3_PUBLIC_BUCKET: loomcast-public
      LOOMCAST_E2E_S3: required
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: loomcast
          POSTGRES_PASSWORD: loomcast
          POSTGRES_DB: loomcast
        ports:
          - 55434:5432
        options: >-
          --health-cmd "pg_isready -U loomcast -d loomcast"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A step rather than a service container: services cannot override the image command, and
      # SeaweedFS needs one to serve S3. Same image, command and s3.json as docker-compose.yml.
      - name: Start object storage
        run: |
          docker run -d --name seaweedfs -p 127.0.0.1:59000:8333 \
            -v "$PWD/infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:4.48 server -dir=/data -ip.bind=0.0.0.0 -filer \
            -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
          curl -s -o /dev/null --retry 60 --retry-delay 1 --retry-all-errors \
            http://127.0.0.1:59000/
          access_key="$(jq -r '.identities[0].credentials[0].accessKey' infra/seaweedfs/s3.json)"
          secret_key="$(jq -r '.identities[0].credentials[0].secretKey' infra/seaweedfs/s3.json)"
          docker run --rm --network host \
            -v "$PWD/infra/seaweedfs/s3-init.sh:/s3-init.sh:ro" \
            -e AWS_ENDPOINT_URL=http://127.0.0.1:59000 -e AWS_DEFAULT_REGION=us-east-1 \
            -e AWS_ACCESS_KEY_ID="$access_key" -e AWS_SECRET_ACCESS_KEY="$secret_key" \
            -e S3_BUCKET -e S3_PUBLIC_BUCKET \
            --entrypoint /bin/sh amazon/aws-cli:2.31.0 /s3-init.sh
          echo "S3_ACCESS_KEY=$access_key" >> "$GITHUB_ENV"
          echo "S3_SECRET_KEY=$secret_key" >> "$GITHUB_ENV"

      - name: Install Chromium
        run: pnpm --filter @loomcast/e2e exec playwright install --with-deps chromium

      - name: Run the end-to-end smoke
        run: pnpm test:e2e

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore
