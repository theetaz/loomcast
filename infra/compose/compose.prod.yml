# Loomcast production compose project. It shares its host with other applications, so every
# service is memory-capped, publishes only on 127.0.0.1 and runs with a minimal privilege set.
#
# Run (the deploy script does this with the extracted copy of this file):
#   docker compose -p loomcast -f compose.prod.yml --env-file /opt/loomcast/env/compose.env up -d --wait
#
# Interpolation variables come from compose.env (see env/compose.env.example). Service settings
# come from api.env, postgres.env and backup.env in LOOMCAST_ENV_DIR. The database is the host's
# shared Postgres (platform-postgres on the external "platform" network), not part of this
# project. The README next to this file explains each file; docs/runbooks/backup-and-restore.md
# covers the backup service.

name: loomcast

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging: *logging

services:
  api:
    <<: *hardening
    image: ghcr.io/theetaz/loomcast:${LOOMCAST_TAG:?set LOOMCAST_TAG in compose.env}
    init: true
    env_file:
      - path: ${LOOMCAST_ENV_DIR:-/opt/loomcast/env}/api.env${LOOMCAST_ENV_SUFFIX:-}
    environment:
      # Fixed here so the port mapping below always matches; everything else is in api.env.
      # API_HOST stays unset: in production the api listens on every interface of the container.
      NODE_ENV: production
      API_PORT: "8790"
      # Keep the heap well under mem_limit so V8 collects garbage before the kernel kills it.
      NODE_OPTIONS: --enable-source-maps --max-old-space-size=${API_HEAP_MB:-448}
      # The backup service's directory, mounted read-only below. The api reads last-success.json
      # for the ops status and alerts when the last backup is older than 26 hours.
      BACKUP_DIR: /backups
    ports:
      - "127.0.0.1:${LOOMCAST_HTTP_PORT:?set LOOMCAST_HTTP_PORT in compose.env}:8790"
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    volumes:
      # Read-only. The directory is mode 0711 (owner uid 70), so the api (uid 1000) can open
      # last-success.json and last-failure.json by name but cannot list or read the dumps (0600).
      - type: bind
        source: ${LOOMCAST_BACKUP_DIR:-/opt/loomcast/backups}
        target: /backups
        read_only: true
        bind:
          create_host_path: false
    mem_limit: ${API_MEM:-640m}
    memswap_limit: ${API_MEM:-640m}
    cpus: 1.0
    pids_limit: 256
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8790/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - egress
      - platform

  # Nightly pg_dump of the Loomcast database into LOOMCAST_BACKUP_DIR (default
  # /opt/loomcast/backups), with local rotation and an off-site copy in the private backups
  # bucket, encrypted with age. It reads only this project's database and writes only to that
  # directory and that bucket.
  backup:
    <<: *hardening
    image: ghcr.io/theetaz/loomcast-backup:${LOOMCAST_TAG:?set LOOMCAST_TAG in compose.env}
    init: true
    # The image's postgres user (uid 70) owns the backup directory on the host.
    user: "70:70"
    env_file:
      # The database user, name and password, so they are kept in one file.
      - path: ${LOOMCAST_ENV_DIR:-/opt/loomcast/env}/postgres.env${LOOMCAST_ENV_SUFFIX:-}
      - path: ${LOOMCAST_ENV_DIR:-/opt/loomcast/env}/backup.env${LOOMCAST_ENV_SUFFIX:-}
    environment:
      PGHOST: ${LOOMCAST_PGHOST:-platform-postgres}
      PGPORT: "5432"
      BACKUP_DIR: /backups
    volumes:
      # Created by the operator with the right owner (see the runbook); never created here as root.
      - type: bind
        source: ${LOOMCAST_BACKUP_DIR:-/opt/loomcast/backups}
        target: /backups
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid,nodev
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    pids_limit: 64
    # Lets a dump in progress finish on a redeploy.
    stop_grace_period: 60s
    # platform reaches the shared Postgres; egress is for object storage and the alert webhook.
    networks:
      - egress
      - platform

networks:
  # Outbound access for the api (object storage, publishing APIs, alert webhooks).
  egress: {}
  # The host's shared data services (/opt/platform): one Postgres for every app on the host
  # (platform-postgres:5432), created outside this project.
  platform:
    name: ${LOOMCAST_PLATFORM_NETWORK:-platform}
    external: true
