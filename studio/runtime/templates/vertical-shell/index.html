<!doctype html>
<!--
  Loomcast vertical shell, 1080x1920 at 30 fps. Generated by the studio runtime; do not edit the
  copy in a render folder by hand. Layers, top to bottom of the frame:
    hook band   (y 220-620)   the opening line of the script, on the style's background
    card area   (y 660-1268)  landscape cards scaled to 1080 wide; 9:16 cards take the full frame
    caption band (y 1330-1600) word-timed captions, two lines at most
  The bottom 320 px stay clear for platform controls.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>{{TITLE}}</title>
    <script src="assets/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/tokens.css" />
    <link rel="stylesheet" href="assets/shell.css" />
  </head>
  <body>
    <div
      id="root"
      data-composition-id="loomcast-short"
      data-start="0"
      data-duration="{{DURATION}}"
      data-width="1080"
      data-height="1920"
      data-fps="30"
    >
      <div class="lc-backdrop"></div>
      <header class="lc-hook" style="--lc-hook-size: {{HOOK_SIZE}}px">
        <p class="lc-hook-text">{{HOOK}}</p>
        <div class="lc-brand">{{GLYPH}}<span>loomcast</span></div>
      </header>
      <div class="lc-safe-area"></div>
{{CARDS}}
{{CAPTIONS}}
      <!-- biome-ignore lint/a11y/useMediaCaption: captions are drawn into the video frames -->
      <audio
        id="lc-voice"
        src="assets/voice.mp3"
        data-start="0"
        data-duration="{{DURATION}}"
        data-track-index="3"
        data-volume="1"
      ></audio>
    </div>
{{SHELL_SCRIPT}}
  </body>
</html>
